[package]
name = "niflheim"
version = "0.1.0"
edition = "2024"
description = "Niflheim — a descent RPG that teaches deep Rust. Floor 1: The Lending Vaults (Domain 1, Ownership)."
license = "Apache-2.0"

[lib]
name = "niflheim"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "niflheim"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "ui",
    "android-game-activity",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
bevy_android = "0.20"

[package.metadata.android]
apk_name = "Niflheim"
assets = "assets"

[profile.release]
lto = "thin"
